<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TaskFlow — Task Management</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">

      <div class="brand">
        <div class="brand-logo">T</div>
        <span>TaskFlow</span>
      </div>

      <nav class="navigation" aria-label="Main navigation">

        <a href="#" class="nav-item active">
          <span>Dashboard</span>
        </a>

        <a href="#" class="nav-item">
          <span>My Tasks</span>
        </a>

        <a href="#" class="nav-item">
          <span>Completed</span>
        </a>

      </nav>

    </aside>


    <!-- Main Application -->
    <div class="main-wrapper">

      <!-- Header -->
      <header class="header">

        <div>
          <h1>Task Management</h1>
          <p>Manage your tasks and stay productive.</p>
        </div>

        <div class="profile">
          <div class="avatar">RS</div>

          <div class="profile-info">
            <strong>Rahul Sharma</strong>
            <span>Student</span>
          </div>
        </div>

      </header>


      <main class="main-content">

        <!-- Summary -->
        <section class="summary-section" aria-label="Task summary">

          <article class="summary-card">
            <span class="summary-label">Total Tasks</span>
            <strong id="totalTasks">0</strong>
          </article>

          <article class="summary-card">
            <span class="summary-label">Pending</span>
            <strong id="pendingTasks">0</strong>
          </article>

          <article class="summary-card">
            <span class="summary-label">Completed</span>
            <strong id="completedTasks">0</strong>
          </article>

        </section>


        <!-- Task Controls -->
        <section class="task-section">

          <div class="section-header">

            <div>
              <h2>My Tasks</h2>
              <p>View and manage your tasks.</p>
            </div>

            <button
              type="button"
              id="addTaskButton"
              class="primary-button"
            >
              + Add Task
            </button>

          </div>


          <div class="task-controls">

            <div class="search-wrapper">
              <label for="searchInput" class="sr-only">
                Search tasks
              </label>

              <input
                type="search"
                id="searchInput"
                placeholder="Search tasks..."
              />
            </div>


            <div class="filter-wrapper">

              <label for="statusFilter" class="sr-only">
                Filter tasks
              </label>

              <select id="statusFilter">
                <option value="all">All Tasks</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
              </select>

            </div>


            <div class="sort-wrapper">

              <label for="sortSelect" class="sr-only">
                Sort tasks
              </label>

              <select id="sortSelect">
                <option value="default">Sort By</option>
                <option value="dueDate">Due Date</option>
                <option value="priority">Priority</option>
                <option value="title">Title</option>
              </select>

            </div>

          </div>


          <!-- Task List -->
          <div
            id="taskList"
            class="task-list"
            aria-live="polite"
          >

            <!--
              Students will implement dynamic task rendering here.
            -->

            <div class="empty-state" id="emptyState">

              <div class="empty-icon">✓</div>

              <h3>No tasks yet</h3>

              <p>
                Add your first task to get started.
              </p>

            </div>

          </div>

        </section>

      </main>

    </div>

  </div>


  <!-- Add / Edit Task Modal -->

  <div
    id="taskModal"
    class="modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
  >

    <div class="modal-overlay"></div>

    <div class="modal-content">

      <div class="modal-header">

        <div>
          <h2 id="modalTitle">Add Task</h2>
          <p>Create a new task.</p>
        </div>

        <button
          type="button"
          id="closeModalButton"
          class="icon-button"
          aria-label="Close modal"
        >
          ×
        </button>

      </div>


      <form id="taskForm">

        <div class="form-group">

          <label for="taskTitle">
            Task Title
          </label>

          <input
            type="text"
            id="taskTitle"
            name="title"
            placeholder="Enter task title"
            required
          />

        </div>


        <div class="form-group">

          <label for="taskDescription">
            Description
          </label>

          <textarea
            id="taskDescription"
            name="description"
            rows="4"
            placeholder="Enter task description"
          ></textarea>

        </div>


        <div class="form-row">

          <div class="form-group">

            <label for="taskPriority">
              Priority
            </label>

            <select
              id="taskPriority"
              name="priority"
              required
            >
              <option value="">Select priority</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>

          </div>


          <div class="form-group">

            <label for="taskDueDate">
              Due Date
            </label>

            <input
              type="date"
              id="taskDueDate"
              name="dueDate"
              required
            />

          </div>

        </div>


        <div class="form-actions">

          <button
            type="button"
            id="cancelTaskButton"
            class="secondary-button"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="primary-button"
          >
            Save Task
          </button>

        </div>

      </form>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
