<!DOCTYPE html>
<html>
<head>
    <title>Student Admission Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Admission Form</h1>

    <div class="container">

        <form id="admissionForm">

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name">
            <p class="error" id="nameError"></p>

            <label for="email">Email</label>
            <input type="text" id="email" placeholder="Enter your email">
            <p class="error" id="emailError"></p>

            <label for="number">Phone Number</label>
            <input type="number" id="number" placeholder="Enter your number">
            <p class="error" id="numberError"></p>

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob">
            <p class="error" id="dobError"></p>

            <label>Gender</label>

            <div class="option">
                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female"> Female
                <input type="radio" name="gender" value="Other"> Other
            </div>

            <p class="error" id="genderError"></p>

            <label for="course">Select Course</label>

            <select id="course">
                <option value="">Select a course</option>
                <option value="Web Development">Web Development</option>
                <option value="UI/UX">UI/UX</option>
                <option value="Python">Python</option>
                <option value="Data Analytics">Data Analytics</option>
            </select>

            <p class="error" id="courseError"></p>

            <label>Skills</label>

            <div class="option">
                <input type="checkbox" name="skill" value="HTML"> HTML
                <input type="checkbox" name="skill" value="CSS"> CSS
                <input type="checkbox" name="skill" value="JavaScript"> JavaScript
                <input type="checkbox" name="skill" value="Git"> Git
            </div>

            <p class="error" id="skillError"></p>

            <label for="about">About Student</label>

            <textarea id="about" placeholder="Tell us about yourself"></textarea>

            <p class="error" id="aboutError"></p>

            <label for="photo">Upload Student Photo</label>

            <input type="file" id="photo" accept="image/*">

            <button type="button" id="uploadBtn">
                Upload Photo
            </button>

            <p id="fileName"></p>
            <p class="error" id="photoError"></p>

            <button type="submit">Submit Application</button>

            <h3>Total Students: <span id="count">0</span></h3>

        </form>

    </div>

    <div class="submitted">

        <h2>Submitted Applications</h2>

        <div id="applications"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
